name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ["1.96.1", stable]
    env:
      RUST_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy, both meters
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features owned-copy-meter -- -D warnings

      - name: Tests with the corrected meter
        run: cargo test --locked

      - name: Example
        run: cargo run --locked --example split

      # The feature makes the defective meter the default read path. The two tests that show each meter explicitly still pass, and each regression test must fail.
      - name: Regression tests fail with the defective meter
        run: |
          cargo test --locked --features owned-copy-meter --test residency_split -- --exact owned_copy_meter_splits_replicas_between_the_two_charges logical_extent_meter_never_splits
          for name in replicas_under_different_memory_pressure_agree_at_every_budget one_read_has_one_boundary_in_every_residency_state; do
            if cargo test --locked --features owned-copy-meter --test residency_split -- --exact "$name"; then
              echo "::error::$name passed with the defective meter; it must fail"
              exit 1
            fi
          done
